# ── Imperial City economy baseline (AUD-style formatting, e.g. $1,250) ──
# Every value here is read server-side only. Clients never define amounts.
# Full balancing rationale: docs/08-economy.md

# Starter package
set imperial:econ:starterCash 750
set imperial:econ:starterBank 4250
set imperial:econ:starterApartmentRentPerWeek 250

# Civilian job payouts (per completed unit, before bonuses)
set imperial:econ:pay:garbage 85
set imperial:econ:pay:tow 140
set imperial:econ:pay:trucking 190
set imperial:econ:pay:bus_route 260
set imperial:econ:pay:postal 70
set imperial:econ:pay:recycle 12
set imperial:econ:pay:mining_ore 18
set imperial:econ:pay:mining_stone 8
set imperial:econ:pay:mining_coal 12
set imperial:econ:pay:lumber_log 16
set imperial:econ:pay:lumber_plank 28
set imperial:econ:pay:fishing_fish 24
set imperial:econ:pay:produce_box 180
set imperial:econ:pay:fire_incident 180

# Emergency service salaries (per pay period)
set imperial:econ:salary:police_base 425
set imperial:econ:salary:ems_base 400
set imperial:econ:salary:fire_base 400

# Business
set imperial:econ:business:registrationFee 25000
set imperial:econ:business:transactionTaxPct 4
set imperial:econ:business:defaultWage 150

# Gangs & turfs
set imperial:econ:gang:creationFee 50000
set imperial:econ:turf:incomePerCycle 2000

# Criminal payouts (bands enforced server-side)
set imperial:econ:crime:storeRegisterMin 400
set imperial:econ:crime:storeRegisterMax 900
set imperial:econ:crime:launderFeePct 22
set imperial:econ:crime:boostBandC 1500
set imperial:econ:crime:boostBandB 3200
set imperial:econ:crime:boostBandA 6500

# Sinks
set imperial:econ:sink:carwash 20
set imperial:econ:sink:fuelMultiplier 100
