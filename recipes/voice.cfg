# pma-voice configuration (see https://github.com/AvarianKnight/pma-voice)
setr voice_useNativeAudio true
# pma-voice recommends false: makes clients ignore client-sent position info.
setr voice_useSendingRangeOnly false
setr voice_defaultCycle "F11"
setr voice_enableRadioAnim 1
setr voice_syncData 1
# These are integer percentages (0-100), not floats. pma-voice warns and resets
# to its defaults if given a float, so 0.3 was silently becoming 30 anyway.
# (voice_defaultVolume was removed: pma-voice has no such convar.)
setr voice_defaultRadioVolume 30
setr voice_defaultCallVolume 60
setr voice_enableUi 1
setr voice_enableProximityCycle 1
setr voice_allowSetIntent 1
setr voice_enableSubmix 1

# Radio access is granted by mm_radio / job logic, never by default
setr voice_enableRadios 1
