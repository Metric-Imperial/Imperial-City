# ── Imperial City permission groups ────────────────────────────────────
# Principals: group.admin > group.mod > builtin.everyone
# txAdmin owner is added via {{addPrincipalsMaster}} in server.cfg.

# qbx_core checks a BARE ace named after the group -- IsPlayerAceAllowed(src,
# 'admin') -- not the `group.admin` principal, in `GetPermission`, the admin
# queue predicate, and the open/close-server commands. Being a member of
# group.admin does not satisfy that check on its own, so without these two lines
# an admin reads as an ordinary player: qbx_afk kicks them for idling, they get
# no queue priority, and /openserver drops them for "no permission".
# Keep these in step with qbx_core's `permissions` list ('god', 'admin', 'mod').
add_ace group.admin admin allow
add_ace group.mod mod allow

add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace group.admin qbx.forceduty allow

add_ace group.mod command.kick allow
add_ace group.mod qbx.announce allow

# qbx_adminmenu
add_ace group.admin qbx_adminmenu allow
add_ace group.mod qbx_adminmenu.limited allow

# ox_doorlock management
add_ace group.admin command.doorlock allow

# Imperial administrative commands (all server-side validated as well)
add_ace group.admin imperial.admin allow
add_ace group.admin imperial.gangs.admin allow
add_ace group.admin imperial.business.admin allow
add_ace group.admin imperial.mdt.admin allow
add_ace group.admin imperial.dispatch.admin allow

# Example principals — replace with real identifiers:
# add_principal identifier.license:0000000000000000000000000000000000000000 group.admin
