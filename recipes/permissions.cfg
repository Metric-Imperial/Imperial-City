# ── Imperial City permission groups ────────────────────────────────────
# Principals: group.admin > group.mod > builtin.everyone
# txAdmin owner is added via {{addPrincipalsMaster}} in server.cfg.

add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace group.admin qbx.forceduty allow

add_ace group.mod command.kick allow
add_ace group.mod qbx.announce allow

# qbx_adminmenu
add_ace group.admin qbx_adminmenu allow
add_ace group.mod qbx_adminmenu.limited allow

# ox_doorlock management
add_ace group.admin command.doorlock allow

# Imperial administrative commands (all server-side validated as well)
add_ace group.admin imperial.admin allow
add_ace group.admin imperial.gangs.admin allow
add_ace group.admin imperial.business.admin allow
add_ace group.admin imperial.mdt.admin allow
add_ace group.admin imperial.dispatch.admin allow

