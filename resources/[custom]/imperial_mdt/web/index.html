<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Imperial MDT</title>
<style>
  /* A NUI page composites over the game, so the root canvas MUST stay
     transparent. Do NOT put `color-scheme: dark` on :root -- it makes CEF
     paint the canvas opaque black, producing a full-screen black layer over
     the game for as long as this resource is running. `background:
     transparent` on body cannot undo it (the canvas colour comes from the
     root element, not body), and `display: none` on body does not help
     either, because the canvas is painted regardless of its contents.
     Scope color-scheme to the panel so form controls stay dark. */
  html, body { background: transparent; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', Roboto, sans-serif;
    color: #e7e9ec; display: none;
  }
  #app { color-scheme: dark; }
  body.visible { display: block; }
  #app {
    position: fixed; top: 6vh; left: 50%; transform: translateX(-50%);
    width: 900px; max-width: 92vw; height: 84vh;
    background: rgba(18, 20, 24, 0.96); border: 1px solid #2c3038;
    border-radius: 10px; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid #2c3038; background: #16181d;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.04em; color: #f1e542; }
  header button { background: none; border: none; color: #9aa0aa; font-size: 18px; cursor: pointer; }
  nav { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid #2c3038; }
  nav button {
    background: #1c1f26; border: 1px solid #2c3038; color: #cfd3da;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  nav button.active { background: #f1e542; color: #16181d; border-color: #f1e542; }
  main { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  input, textarea, select {
    background: #1c1f26; border: 1px solid #2c3038; color: #e7e9ec;
    padding: 8px 10px; border-radius: 6px; font-size: 13px; width: 100%;
  }
  textarea { min-height: 100px; resize: vertical; }
  button.action {
    background: #2b3a52; border: 1px solid #3a4d6e; color: #cfe0ff;
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  button.action:hover { background: #35486a; }
  .list-item {
    background: #1a1d23; border: 1px solid #262a32; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .list-item:hover { border-color: #f1e542; }
  .list-item .meta { color: #8a909b; font-size: 11px; margin-top: 4px; }
  .empty { color: #6c7280; font-style: italic; padding: 20px 0; text-align: center; }
  .badge { display: inline-block; background: #3a2b2b; color: #ffb0b0; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
</style>
</head>
<body>
<div id="app" style="display:none;">
  <header>
    <h1>IMPERIAL CITY — MDT</h1>
    <button id="closeBtn">✕</button>
  </header>
  <nav id="tabs">
    <button data-tab="reports" class="active">Reports</button>
    <button data-tab="newreport">New Report</button>
    <button data-tab="warrants">Warrants</button>
    <button data-tab="bolos">BOLOs</button>
    <button data-tab="lookup">Person Lookup</button>
  </nav>
  <main id="main"></main>
</div>
<script>
const hasNui = typeof GetParentResourceName === 'function';
const resourceName = hasNui ? GetParentResourceName() : 'imperial_mdt';

async function call(name, args) {
  if (!hasNui) {
    console.log('[dev] call', name, args);
    return [];
  }
  const res = await fetch(`https://${resourceName}/${name}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ args: args || [] }),
  });
  return res.json();
}

const app = document.getElementById('app');
const main = document.getElementById('main');
const tabs = document.getElementById('tabs');

function setTab(name) {
  [...tabs.children].forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  render(name);
}
tabs.addEventListener('click', e => {
  if (e.target.dataset.tab) setTab(e.target.dataset.tab);
});
document.getElementById('closeBtn').addEventListener('click', () => call('close'));

async function render(tab) {
  main.innerHTML = '<div class="empty">Loading…</div>';
  if (tab === 'reports') return renderReports();
  if (tab === 'newreport') return renderNewReport();
  if (tab === 'warrants') return renderWarrants();
  if (tab === 'bolos') return renderBolos();
  if (tab === 'lookup') return renderLookup();
}

async function renderReports() {
  const rows = await call('getReports', [{}]) || [];
  if (!rows.length) { main.innerHTML = '<div class="empty">No reports on file.</div>'; return; }
  main.innerHTML = rows.map(r => `
    <div class="list-item">
      <strong>${escapeHtml(r.title)}</strong>
      <div class="meta">#${r.id} · ${escapeHtml(r.type)} · ${new Date(r.created_at * 1000).toLocaleString()}</div>
    </div>`).join('');
}

async function renderNewReport() {
  main.innerHTML = `
    <div class="row"><input id="rTitle" placeholder="Title" /></div>
    <div class="row"><input id="rSubject" placeholder="Subject citizen ID (optional)" /></div>
    <div class="row"><textarea id="rBody" placeholder="Report details…"></textarea></div>
    <div class="row"><button class="action" id="rSubmit">Submit Report</button></div>
  `;
  document.getElementById('rSubmit').addEventListener('click', async () => {
    const title = document.getElementById('rTitle').value.trim();
    const body = document.getElementById('rBody').value.trim();
    const subject = document.getElementById('rSubject').value.trim() || null;
    if (!title || !body) return;
    await call('createReport', [{ title, body, subjectCitizenid: subject, type: 'incident' }]);
    setTab('reports');
  });
}

async function renderWarrants() {
  const rows = await call('getWarrants', []) || [];
  main.innerHTML = (rows.length ? rows.map(w => `
    <div class="list-item">
      <span class="badge">ACTIVE</span> <strong>${escapeHtml(w.subject_citizenid)}</strong>
      <div class="meta">${escapeHtml(w.reason)} · issued by ${escapeHtml(w.issued_by)}</div>
    </div>`).join('') : '<div class="empty">No active warrants.</div>')
    + `<div class="row" style="margin-top:14px;">
        <input id="wSubject" placeholder="Subject citizen ID" />
        <input id="wReason" placeholder="Reason" />
        <button class="action" id="wSubmit">Issue Warrant</button>
      </div>`;
  document.getElementById('wSubmit').addEventListener('click', async () => {
    const subject = document.getElementById('wSubject').value.trim();
    const reason = document.getElementById('wReason').value.trim();
    if (!subject || !reason) return;
    await call('createWarrant', [subject, reason]);
    renderWarrants();
  });
}

async function renderBolos() {
  const rows = await call('getBolos', []) || [];
  main.innerHTML = (rows.length ? rows.map(b => `
    <div class="list-item">
      <strong>${escapeHtml(b.title)}</strong>${b.plate ? ` <span class="badge">${escapeHtml(b.plate)}</span>` : ''}
      <div class="meta">${escapeHtml(b.description)}</div>
    </div>`).join('') : '<div class="empty">No active BOLOs.</div>')
    + `<div class="row" style="margin-top:14px;">
        <input id="bTitle" placeholder="Title" />
        <input id="bPlate" placeholder="Plate (optional)" />
      </div>
      <div class="row"><input id="bDesc" placeholder="Description" /></div>
      <div class="row"><button class="action" id="bSubmit">Issue BOLO</button></div>`;
  document.getElementById('bSubmit').addEventListener('click', async () => {
    const title = document.getElementById('bTitle').value.trim();
    const desc = document.getElementById('bDesc').value.trim();
    const plate = document.getElementById('bPlate').value.trim() || null;
    if (!title || !desc) return;
    await call('createBolo', [title, desc, plate]);
    renderBolos();
  });
}

async function renderLookup() {
  main.innerHTML = `
    <div class="row"><input id="lId" placeholder="Citizen ID" /><button class="action" id="lSubmit">Search</button></div>
    <div id="lResult"></div>
  `;
  document.getElementById('lSubmit').addEventListener('click', async () => {
    const id = document.getElementById('lId').value.trim();
    if (!id) return;
    const result = await call('lookupPerson', [id]);
    const box = document.getElementById('lResult');
    if (!result) { box.innerHTML = '<div class="empty">No record found.</div>'; return; }
    box.innerHTML = `
      <h3 style="color:#f1e542;">${escapeHtml(result.name)} (${escapeHtml(result.citizenid)})</h3>
      <p>${result.warrants.length} active warrant(s)</p>
      ${result.reports.map(r => `<div class="list-item">${escapeHtml(r.title)}<div class="meta">#${r.id} · ${escapeHtml(r.type)}</div></div>`).join('') || '<div class="empty">No reports.</div>'}
    `;
  });
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

window.addEventListener('message', evt => {
  const data = evt.data;
  if (data.action === 'setVisible') {
    app.style.display = data.visible ? 'block' : 'none';
    document.body.classList.toggle('visible', data.visible);
    if (data.visible) setTab('reports');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('visible')) call('close');
});
</script>
</body>
</html>
